<div class="ironclaw2e ironclaw2e-dialog">
    <div class="form-group">
        <label>{{localize "ironclaw2e.dialog.addCondition.toAdd"}}</label>
        <select name="condition">
            {{selectOptions systemConditions localize=true selected=readySelected}}
        </select>
    </div>
    <div class="form-group">
        <label>{{localize "ironclaw2e.dialog.addCondition.quota"}}</label>
        <input type="number" class="dialog-number" name="quota" value="{{readyQuota}}" min="0" onfocus="this.select();" />
    </div>
</div>
