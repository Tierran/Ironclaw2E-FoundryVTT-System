<div class="ironclaw2e ironclaw2e-dialog">
    <div class="form-group">
        <label>{{localize "ironclaw2e.dialog.damageCalc.received"}}</label>
        <input type="number" class="dialog-number" name="damage" value="{{readydamage}}" onfocus="this.select();" />
    </div>
    <div class="form-group">
        <label>{{localize "ironclaw2e.dialog.damageCalc.soaked"}}</label>
        <input type="number" class="dialog-number" name="soak" value="{{readysoak}}" onfocus="this.select();" />
    </div>
    {{#if (equalTo actorScaleType "personal")}}
    <div class="form-group">
        <label>{{localize "ironclaw2e.dialog.damageCalc.conditionDamage" condition=hurtLabel}}</label>
        <input type="checkbox" name="hurt" {{checked isHurt}} />
    </div>
    <div class="form-group">
        <label>{{localize "ironclaw2e.dialog.damageCalc.conditionDamage" condition=injuredLabel}}</label>
        <input type="checkbox" name="injured" {{checked isInjured}} />
    </div>
    {{/if}}
    <div class="form-group">
        <label>{{localize "ironclaw2e.dialog.damageCalc.attack"}}</label>
        <input type="checkbox" name="attack" checked />
    </div>
    {{#if (equalTo actorScaleType "personal")}}
    <div class="form-group">
        <label>{{localize "ironclaw2e.dialog.damageCalc.knockoutStrike"}}</label>
        <input type="checkbox" name="knockout" />
    </div>
    <div class="form-group">
        <label>{{localize "ironclaw2e.dialog.damageCalc.nonLethal"}}</label>
        <input type="checkbox" name="nonlethal" />
    </div>
    {{/if}}
    {{#if hasWard}}
    <div class="form-group">
        <label>{{localize "ironclaw2e.dialog.damageCalc.reduceWard" value=temporaryWard}}</label>
        <input type="checkbox" name="reduceward" checked />
    </div>
    {{/if}}
    <div class="form-group">
        <label>{{localize "ironclaw2e.dialog.damageCalc.damageConditions"}}</label>
        <input type="text" name="cond" value="{{damageconditions}}" />
    </div>
    <div class="form-group">
        <label>{{localize "ironclaw2e.dialog.sendToChat"}}</label>
        <input type="checkbox" name="send" {{checked confirmSend}} />
    </div>
</div>
