<div class="ironclaw2e ironclaw2e-request-roll">
    <div class="form-group">
        <label>{{localize "ironclaw2e.dialog.requestRoll.requestRollAsUser"}}:</label>
        <select name="selectuser">
            <option value="0" selected>{{userAlias}}</option>
            <option value="1">{{macroAlias}}</option>
        </select>
    </div>
    <div class="form-group">
        <label>{{localize "ironclaw2e.dialog.requestRoll.whisperLabel"}}:</label>
        <select name="whisper">
            <option value="">{{localize "ironclaw2e.dialog.requestRoll.whisperEveryone"}}</option>
            {{#each whisperUsers as |user|}}
            <option value="{{user.name}}" {{#if user.selected}}selected{{/if}}>{{user.name}}</option>
            {{/each}}
        </select>
    </div>
    <div class="form-group">
        <label>{{localize "ironclaw2e.dialog.requestRoll.targetNumber"}}:</label>
        <input type="number" class="request-roll-tn" name="tn" value="{{tnnum}}" step="1" onfocus="this.select();" />
    </div>

    <fieldset>
        <legend>{{localize "ironclaw2e.actor.traits"}}</legend>
        <div class="request-roll-stats">
            {{#each traits as |stat|}}
            <label class="request-roll-stat">
                <input type="checkbox" name="stat.{{stat.key}}" {{checked stat.checked}} />
                <span>{{stat.label}}</span>
            </label>
            {{/each}}
        </div>
    </fieldset>

    <fieldset>
        <legend>{{localize "ironclaw2e.actor.skills"}}</legend>
        <div class="request-roll-stats">
            {{#each skills as |stat|}}
            <label class="request-roll-stat">
                <input type="checkbox" name="stat.{{stat.key}}" {{checked stat.checked}} />
                <span>{{stat.label}}</span>
            </label>
            {{/each}}
        </div>
    </fieldset>

    <div class="form-group">
        <label>{{localize "ironclaw2e.dialog.requestRoll.giftsToRequest"}}:</label>
        <input type="text" name="gifts" value="{{readygifts}}" placeholder="{{localize "ironclaw2e.dialog.requestRoll.giftsPlaceholder"}}" />
    </div>
</div>
